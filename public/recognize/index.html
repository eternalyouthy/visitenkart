<script>
  // Apply saved theme before first paint (avoids a flash of the wrong theme).
  try {
    var t = localStorage.getItem('gt.theme'), ok = /^(orbit|holo|nord|autobahn|swiss|light)$/;
    if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'orbit';
    if (!ok.test(t)) t = 'orbit';   // nothing saved (or legacy 'dark') -> Orbit
    document.documentElement.setAttribute('data-theme', t);
    var bars = { orbit: '#04060a', holo: '#07061a', nord: '#1b2029', autobahn: '#1b4f9c', swiss: '#ffffff', light: '#f4f6fa' };
    document.querySelector('meta[name="theme-color"]').setAttribute('content', bars[t]);
  } catch (e) {}
</script>
