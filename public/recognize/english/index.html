<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#04060a">
<title>ETRNL / ENGLISH</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #04060a; color: #9aa6b8;
    font: 13px/1.6 ui-monospace, "JetBrains Mono", monospace; letter-spacing: 0.16em; text-transform: uppercase; }
  a { color: #8ccbff; }
</style>
<script>
  /* English now lives in the unified ETRNL site (one app for German, English and Russian).
   * This page switches "I learn" to English and forwards there, keeping the old route (#/...).
   * Old English progress (etrnl.english.progress.v1) is imported automatically the first time English opens. */
  (function () {
    try {
      var key = 'etrnl.settings.v1', s = JSON.parse(localStorage.getItem(key) || '{}') || {};
      s.learnLang = 'en';
      if (!s.knowLang || s.knowLang === 'en') s.knowLang = 'ru';
      localStorage.setItem(key, JSON.stringify(s));
    } catch (e) { /* storage blocked: the unified app still opens, with its saved/default pair */ }
    location.replace('../index.html' + (location.hash || '#/words'));
  })();
</script>
</head>
<body>
  <p>Opening ETRNL · English… <a href="../index.html#/words">Continue</a></p>
</body>
</html>
