<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artem Bilyi — Identity &amp; Access</title>
    <meta name="description" content="Artem Bilyi — Security Engineer focused on Identity & Access Management: Microsoft Entra ID, Microsoft Graph API, and who gets access to what, and why." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fff'/%3E%3C/svg%3E" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <style>
        :root{
            --bg:#000;
            --fg:#f5f5f5;
            --muted:#8a8a8a;
            --line:rgba(255,255,255,.14);
            --ease:cubic-bezier(.22,.61,.36,1);
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{
            background:var(--bg);
            color:var(--fg);
            font-family:'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
            font-weight:300;
            line-height:1.6;
            -webkit-font-smoothing:antialiased;
            overflow:hidden;                 /* desktop: no whole-page scroll */
        }

        /* ---- particle canvas ---- */
        #field{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100lvh;z-index:0;display:block}

        /* ---- top bar (brand + language) ---- */
        .topbar{
            position:fixed;top:0;left:0;right:0;z-index:6;
            display:flex;justify-content:flex-end;align-items:center;
            padding:22px clamp(20px,5vw,54px);
            mix-blend-mode:difference;pointer-events:none;
        }
        .topbar > *{pointer-events:auto}
        .brand{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:#fff;font-weight:400}
        .lang{display:flex;gap:1px;font-size:12px;letter-spacing:.1em}
        .lang button{
            background:none;border:none;color:#fff;opacity:.4;cursor:pointer;
            padding:4px 7px;font:inherit;letter-spacing:inherit;
            transition:opacity .35s var(--ease);
        }
        .lang button:hover{opacity:.85}
        .lang button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:5px}

        /* ---- stage: split layout ---- */
        .stage{
            position:relative;z-index:1;
            height:100svh;
            display:flex;align-items:center;
            gap:clamp(28px,5vw,80px);
            padding:96px clamp(20px,5vw,54px) 48px;
            max-width:1320px;margin:0 auto;
        }

        /* ---- left / hero ---- */
        .left{
            flex:0 1 44%;
            min-width:0;
            opacity:0;transform:translateX(7vw);
            transition:opacity 1.1s var(--ease),transform 1.1s var(--ease);
        }
        body.ready .left{opacity:1;transform:none}
        .left .tag{
            font-size:12px;letter-spacing:.3em;text-transform:uppercase;
            color:var(--muted);margin-bottom:22px;
        }
        .left h1{
            font-size:clamp(2.6rem,6.4vw,5rem);
            font-weight:200;letter-spacing:-.02em;line-height:1.02;
        }
        .left .lede{
            margin-top:26px;max-width:30em;
            font-size:clamp(1rem,1.5vw,1.2rem);color:#cfcfcf;font-weight:300;
        }
        .left .lede em{font-style:italic;color:#fff}
        .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px}
        .chip{
            border:1px solid var(--line);padding:6px 14px;font-size:.8rem;
            letter-spacing:.03em;color:#cfcfcf;border-radius:999px;
            transition:border-color .4s var(--ease),color .4s var(--ease),transform .4s var(--ease);
        }
        .chip:hover{border-color:#fff;color:#fff;transform:translateY(-2px)}
        .left .loc{margin-top:30px;font-size:12px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

        /* ---- right / panels ---- */
        .right{
            flex:1 1 50%;
            min-width:0;
            max-height:80svh;
            overflow-y:auto;
            padding-right:6px;
            scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;
        }
        .right::-webkit-scrollbar{width:6px}
        .right::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:3px}

        .panel{
            opacity:0;transform:translateX(34px);
            transition:opacity .9s var(--ease),transform .9s var(--ease);
        }
        body.ready .panel{opacity:1;transform:none}

        .panel-head{
            width:100%;background:none;border:none;color:#fff;font:inherit;
            text-align:left;cursor:pointer;display:flex;align-items:center;gap:16px;
            padding:22px 2px;
            transition:padding-left .45s var(--ease);
        }
        .panel-head:hover{padding-left:12px}
        .p-idx{
            font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
            font-size:.72rem;color:var(--muted);letter-spacing:.1em;flex:none;width:20px;
        }
        .p-label{flex:1;font-size:clamp(1.05rem,1.7vw,1.35rem);font-weight:300;letter-spacing:-.01em}
        .p-sign{position:relative;flex:none;width:14px;height:14px;margin-left:8px}
        .p-sign::before,.p-sign::after{
            content:"";position:absolute;background:var(--muted);
            transition:transform .45s var(--ease),background .3s var(--ease),opacity .3s var(--ease);
        }
        .p-sign::before{top:6px;left:0;width:14px;height:1.4px}
        .p-sign::after{top:0;left:6px;width:1.4px;height:14px}
        .panel-head:hover .p-sign::before,.panel-head:hover .p-sign::after{background:#fff}
        .panel.open .p-sign::after{transform:rotate(90deg);opacity:0}
        .panel.open .p-sign::before{background:#fff}
        .panel.open .p-label{color:#fff}

        .panel-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
        .panel.open .panel-body{grid-template-rows:1fr}
        .panel-inner{overflow:hidden}
        .panel-content{padding:2px 2px 28px 38px;max-width:40em}

        .lead{color:#d0d0d0;margin-bottom:18px}
        .items{list-style:none;display:flex;flex-direction:column;gap:16px}
        .items li .it{color:#fff;font-weight:400}
        .items li .id{color:var(--muted);font-size:.96rem;display:block;margin-top:3px}
        code,.mono{
            font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
            font-size:.84em;background:rgba(255,255,255,.07);padding:1px 6px;border-radius:3px;color:#e8e8e8;
        }

        /* projects inside panel */
        .proj{display:block;text-decoration:none;color:inherit;padding:16px 0;border-bottom:1px solid var(--line);transition:padding-left .45s var(--ease)}
        .proj:first-child{padding-top:0}
        .proj:last-child{border-bottom:none;padding-bottom:0}
        .proj:hover{padding-left:12px}
        .proj-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
        .proj-name{font-size:1.05rem;color:#fff;font-weight:400}
        .proj-meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
        .proj-desc{color:var(--muted);margin-top:6px;font-size:.94rem}
        .arrow{display:inline-block;transition:transform .45s var(--ease)}
        .proj:hover .arrow{transform:translateX(8px)}

        /* contact inside panel */
        .links{display:flex;flex-direction:column;gap:16px}
        .links a{color:var(--fg);text-decoration:none;font-size:1.02rem;position:relative;width:max-content;padding-bottom:3px}
        .links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:#fff;transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
        .links a:hover::after{transform:scaleX(1);transform-origin:left}
        .links .k{color:var(--muted);font-size:11px;letter-spacing:.2em;text-transform:uppercase;display:block;margin-bottom:5px}

        /* ---- email reveal (Turnstile-gated) ---- */
        .email-slot{display:flex;flex-direction:column}
        .reveal-btn{
            display:inline-flex;align-items:center;gap:9px;width:max-content;
            background:none;border:1px solid var(--line);color:#cfcfcf;
            font:inherit;font-size:.9rem;font-weight:300;letter-spacing:.02em;
            padding:8px 16px;border-radius:999px;cursor:pointer;
            transition:border-color .4s var(--ease),color .4s var(--ease),transform .4s var(--ease),opacity .4s var(--ease);
        }
        .reveal-btn:hover:not(:disabled){border-color:#fff;color:#fff;transform:translateY(-2px)}
        .reveal-btn:disabled{opacity:.45;cursor:default}
        .reveal-btn .lock{width:12px;height:12px;flex:none;opacity:.7}
        .reveal-btn .arrow{display:inline-block;transition:transform .45s var(--ease)}
        .reveal-btn:hover:not(:disabled) .arrow{transform:translateX(6px)}
        .ts-box{margin-top:14px;min-height:0}
        .ts-box:empty{margin-top:0}
        .reveal-msg{margin-top:10px;font-size:.84rem;letter-spacing:.02em;color:var(--muted)}
        .reveal-msg.err{color:#e0a3a3}

        /* ---- responsive: phones get normal vertical scroll ---- */
        @media (max-width:860px){
            body{overflow:auto}
            /* let the language switch scroll away with the page instead of overlapping text */
            .topbar{position:absolute}
            .stage{flex-direction:column;align-items:flex-start;height:auto;min-height:100svh;gap:40px;padding:78px 22px 60px}
            .left,.right{flex:1 1 auto;width:100%}
            .right{max-height:none;overflow:visible;padding-right:0}
        }
        @media (prefers-reduced-motion:reduce){
            *{animation:none!important;transition:none!important}
            .left,.panel{opacity:1;transform:none}
            html{scroll-behavior:auto}
        }
    </style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<main class="stage">
    <section class="left">
        <div class="tag" data-i="hero_tag">Security Engineer · Identity &amp; Access</div>
        <h1 data-i="hero_name">Artem Bilyi</h1>
        <p class="lede" data-i="hero_lede"></p>
        <div class="chips" id="tech_chips"></div>
        <div class="loc" data-i="hero_loc">Saarland, Germany</div>
    </section>

    <aside class="right" id="panels"></aside>
</main>

<script>
    /* ============================================================
       CONFIG
       ============================================================ */
    const TURNSTILE_SITEKEY = "0x4AAAAAADz3Z9VFF9DldOId"; // public site key — safe in client
    const EMAIL_ENDPOINT = "/api/email";                 // Pages Function; email lives server-side

    /* ============================================================
       CONTENT — one place, four languages. Easy to extend.
       ============================================================ */
    const DATA = {
        en: {
            brand: "A. BILYI",
            hero_tag: "Security Engineer · Identity & Access",
            hero_name: "Artem Bilyi",
            hero_lede: "Security Engineer in the making, focused on <em>Identity &amp; Access Management</em> — Microsoft Entra ID, Microsoft Graph API, and everything that decides <em>who gets access to what, and why.</em>",
            hero_loc: "Saarland, Germany",

            tech: [
                "Python",
                "Microsoft Graph API",
                "MSAL",
                "Entra ID / Azure",
                "OAuth2 / OIDC",
                "Git · REST"
            ],

            now: {
                title: "What I'm doing now",
                lead: "Right now everything I do points at one question — <em>who gets access to what, and why.</em>",
                items: [
                    {
                        t: "Preparing for SC-300",
                        d: "Microsoft Identity and Access Administrator — the certification that maps directly to the work I enjoy."
                    },
                    {
                        t: "Building <code>entra-id-lifecycle-cli</code>",
                        d: "A Python CLI that automates the Joiner–Mover–Leaver identity lifecycle in Entra ID via raw Microsoft Graph API calls — MSAL + <code>requests</code>, no SDK. I want to see the wire, not the wrapper."
                    },
                    {
                        t: "Running my own Entra ID lab tenant",
                        d: "Dynamic groups, app registrations, service principals, admin consent, PIM, and access reviews — a sandbox where I can break things on purpose and observe what happens."
                    }
                ]
            },

            bg: {
                title: "Background",
                items: [
                    {
                        t: "B.Sc. in Cybersecurity",
                        d: "Oles Honchar Dnipro National University (DNU), Ukraine."
                    },
                    {
                        t: "Identity & Access Management (IAM)",
                        d: "Identity lifecycle management (JML), provisioning, access reviews, and least-privilege access in Microsoft Entra ID."
                    },
                    {
                        t: "OAuth2 / OpenID Connect — protocol level",
                        d: "Hands-on experience through Microsoft Graph: app registrations, service principals, delegated and application permissions, admin consent, and PIM."
                    }
                ]
            },

            proj: {
                title: "Projects",
                list: [
                    {
                        n: "entra-id-lifecycle-cli",
                        m: "Python · Public",
                        d: "Automates the Joiner–Mover–Leaver identity lifecycle in Entra ID through direct Microsoft Graph API calls.",
                        u: "https://github.com/eternalyouthy/entra-id-lifecycle-cli"
                    },
                    {
                        n: "Federated AI CCTV Search Oversight",
                        m: "Concept · Public",
                        d: "A governance architecture for privacy-preserving, federated AI-assisted CCTV searches across independent security zones.",
                        u: "https://github.com/eternalyouthy/Federated-AI-CCTV-Search-Oversight"
                    }
                ]
            },

            contact: {
                title: "Contact",
                email_label: "Email",
                reveal: "Reveal email",
                verifying: "Verifying…",
                error: "Verification failed — please try again"
            }
        }
    };

    /* ---------- email reveal state (persists across language switches) ---------- */
    let revealedEmail = null;   // once fetched, remember it so switching language re-shows it
    let tsWidgetId = null;      // Turnstile explicit-render widget id

    /* ---------- contact panel (email is NOT in this markup — it comes from the server) ---------- */
    function contactsHTML(d){
        const c = d.contact;
        const emailBlock = revealedEmail
            ? `<a href="mailto:${revealedEmail}">${revealedEmail}</a>`
            : `<button type="button" class="reveal-btn" id="reveal-btn">
         <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
           <rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
         </svg>
         <span class="reveal-txt">${c.reveal}</span>
         <span class="arrow">→</span>
       </button>
       <div class="ts-box" id="ts-box"></div>
       <div class="reveal-msg" id="reveal-msg" hidden></div>`;
        return `
  <div class="links">
    <div class="email-slot" id="email-slot">
      <span class="k">${c.email_label}</span>
      ${emailBlock}
    </div>
    /*<a href="https://t.me/eternalyouthieeqq" target="_blank" rel="noopener"><span class="k">Telegram</span>@eternalyouthieeqq</a>*/
    <a href="https://github.com/eternalyouthy" target="_blank" rel="noopener"><span class="k">GitHub</span>eternalyouthy</a>
  </div>`;
    }

    /* which panel is open (null = none). Persists across language switches. */
    let openIndex = null;

    /* ---------- build one panel ---------- */
    function panelHTML(idx, label, bodyHTML){
        const on = idx===openIndex;
        return `
  <div class="panel${on?" open":""}">
    <button class="panel-head" aria-expanded="${on?"true":"false"}">
      <span class="p-idx">${String(idx).padStart(2,"0")}</span>
      <span class="p-label">${label}</span>
      <span class="p-sign" aria-hidden="true"></span>
    </button>
    <div class="panel-body"><div class="panel-inner"><div class="panel-content">${bodyHTML}</div></div></div>
  </div>`;
    }
    function itemsHTML(lead, items){
        const li = items.map(i=>`<li><span class="it">${i.t}</span><span class="id">${i.d}</span></li>`).join("");
        return (lead?`<p class="lead">${lead}</p>`:"") + `<ul class="items">${li}</ul>`;
    }
    function projHTML(list){
        return list.map(p=>`
    <a class="proj" href="${p.u}" target="_blank" rel="noopener">
      <span class="proj-top"><span class="proj-name">${p.n} <span class="arrow">→</span></span><span class="proj-meta">${p.m}</span></span>
      <span class="proj-desc">${p.d}</span>
    </a>`).join("");
    }

    /* ---------- render ---------- */
    function render(lang){
        const d = DATA[lang] || DATA.en;
        document.documentElement.lang = lang==="ua"?"uk":lang;
        document.querySelectorAll("[data-i]").forEach(el=>{
            const k = el.getAttribute("data-i");
            if(d[k]!==undefined) el.innerHTML = d[k];
        });
        document.getElementById("tech_chips").innerHTML = d.tech.map(t=>`<span class="chip">${t}</span>`).join("");

        const panels =
            panelHTML(1, d.now.title,  itemsHTML(d.now.lead, d.now.items)) +
            panelHTML(2, d.bg.title,   itemsHTML("", d.bg.items)) +
            panelHTML(3, d.proj.title, projHTML(d.proj.list)) +
            panelHTML(4, d.contact.title, contactsHTML(d));
        document.getElementById("panels").innerHTML = panels;
        wirePanels();
        wireEmail(d);
    }

    /* ---------- single-open accordion ---------- */
    function wirePanels(){
        const panels = [...document.querySelectorAll(".panel")];
        panels.forEach((panel,i)=>{
            const btn = panel.querySelector(".panel-head");
            btn.addEventListener("click",()=>{
                const isOpen = panel.classList.contains("open");
                panels.forEach(p=>{p.classList.remove("open");p.querySelector(".panel-head").setAttribute("aria-expanded","false");});
                if(!isOpen){ panel.classList.add("open"); btn.setAttribute("aria-expanded","true"); openIndex = i+1; }
                else{ openIndex = null; }
            });
        });
    }

    /* ---------- email reveal (Turnstile-gated) ---------- */
    function wireEmail(d){
        if(revealedEmail) return;                 // already shown as a mailto link
        const btn = document.getElementById("reveal-btn");
        if(!btn) return;
        const tsBox = document.getElementById("ts-box");
        const msg   = document.getElementById("reveal-msg");
        const slot  = document.getElementById("email-slot");
        const c = d.contact;

        function showMsg(text, isErr){
            msg.hidden = false;
            msg.textContent = text;
            msg.classList.toggle("err", !!isErr);
        }

        async function verify(token){
            showMsg(c.verifying, false);
            try{
                const res = await fetch(EMAIL_ENDPOINT, {
                    method:"POST",
                    headers:{ "Content-Type":"application/json" },
                    body: JSON.stringify({ token })
                });
                const data = await res.json().catch(()=>({}));
                if(res.ok && data.email){
                    revealedEmail = data.email;
                    slot.innerHTML =
                        `<span class="k">${c.email_label}</span>` +
                        `<a href="mailto:${data.email}">${data.email}</a>`;
                    return;
                }
                throw new Error("verify_failed");
            }catch(e){
                showMsg(c.error, true);
                btn.disabled = false;
                if(window.turnstile && tsWidgetId!==null){ try{ turnstile.reset(tsWidgetId); }catch(_){} }
            }
        }

        btn.addEventListener("click", ()=>{
            if(!window.turnstile){ showMsg(c.error, true); return; }
            btn.disabled = true;
            msg.hidden = true;
            tsBox.innerHTML = "";
            tsWidgetId = turnstile.render(tsBox, {
                sitekey: TURNSTILE_SITEKEY,
                theme: "dark",
                callback: verify,
                "error-callback": ()=>{ showMsg(c.error, true); btn.disabled = false; },
                "expired-callback": ()=>{ if(window.turnstile && tsWidgetId!==null) turnstile.reset(tsWidgetId); }
            });
        });
    }

    /* ---------- language toggle ---------- */
    const btns = document.querySelectorAll(".lang button");
    btns.forEach(b=>b.addEventListener("click",()=>{
        const lang = b.getAttribute("data-lang");
        btns.forEach(x=>x.setAttribute("aria-pressed", x===b?"true":"false"));
        render(lang);
    }));

    /* ---------- particle field ---------- */
    (function(){
        const canvas = document.getElementById("field");
        const ctx = canvas.getContext("2d");
        const reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
        let w,h,dpr,cssW=0,cssH=0,particles=[],mouse={x:-9999,y:-9999,active:false},raf,lastAspect=null;

        // Current on-screen (CSS px) size of the canvas element.
        function readCss(){
            cssW = canvas.clientWidth  || window.innerWidth;
            cssH = canvas.clientHeight || window.innerHeight;
        }

        function makeParticle(){
            return {
                x:Math.random()*w, y:Math.random()*h,
                vx:(Math.random()-.5)*.12*dpr, vy:(Math.random()-.5)*.12*dpr,
                r:(Math.random()*1.4+.6)*dpr
            };
        }
        function targetCount(){
            let c = Math.round(((w/dpr)*(h/dpr))/13000);
            return Math.max(40, Math.min(c, 150));
        }
        function reconcile(){
            const t = targetCount();
            while(particles.length < t) particles.push(makeParticle());
            if(particles.length > t) particles.length = t;
        }
        function build(){
            particles = [];
            const t = targetCount();
            for(let i=0;i<t;i++) particles.push(makeParticle());
        }

        // Allocate the pixel buffer. The canvas ELEMENT is sized by CSS (100vw x 100lvh) and the
        // browser scales this fixed buffer to fit — so scrolling and zooming never touch it at all
        // (zero JS work in those moments => nothing can jerk). We only reallocate when the window's
        // ASPECT RATIO really changes, and then we stretch existing particles proportionally so the
        // pattern stays continuous instead of regenerating.
        function allocate(initial){
            const prevW = w, prevH = h;
            dpr = Math.min(window.devicePixelRatio||1, 2);
            readCss();
            const nw = Math.max(1, Math.floor(cssW*dpr));
            const nh = Math.max(1, Math.floor(cssH*dpr));
            if(!initial && prevW && prevH && particles.length){
                const sx = nw/prevW, sy = nh/prevH;
                for(const p of particles){ p.x*=sx; p.y*=sy; }
            }
            w = canvas.width  = nw;
            h = canvas.height = nh;
            lastAspect = cssW/cssH;
            if(initial) build(); else reconcile();
        }
        const LINK = 120;
        function step(){
            ctx.clearRect(0,0,w,h);
            const sX = w/(cssW||1), sY = h/(cssH||1);   // cursor is in CSS px -> scale into buffer px
            const link = LINK*dpr, mx = mouse.x*sX, my = mouse.y*sY;
            for(let i=0;i<particles.length;i++){
                const p = particles[i];
                p.x+=p.vx; p.y+=p.vy;
                if(p.x<0||p.x>w) p.vx*=-1;
                if(p.y<0||p.y>h) p.vy*=-1;
                if(mouse.active){
                    const dx=mx-p.x, dy=my-p.y, dist=Math.hypot(dx,dy);
                    if(dist<link*1.6 && dist>0.01){
                        const f=(1-dist/(link*1.6))*0.35;
                        p.x+=dx/dist*f; p.y+=dy/dist*f;
                    }
                }
                ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.fillStyle="rgba(255,255,255,.55)";ctx.fill();
                for(let j=i+1;j<particles.length;j++){
                    const q=particles[j];
                    const dx=p.x-q.x, dy=p.y-q.y, dd=Math.hypot(dx,dy);
                    if(dd<link){
                        ctx.strokeStyle="rgba(255,255,255,"+(0.16*(1-dd/link))+")";
                        ctx.lineWidth=dpr*.6;
                        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
                    }
                }
                if(mouse.active){
                    const dx=p.x-mx, dy=p.y-my, dd=Math.hypot(dx,dy);
                    if(dd<link*1.4){
                        ctx.strokeStyle="rgba(255,255,255,"+(0.28*(1-dd/(link*1.4)))+")";
                        ctx.lineWidth=dpr*.7;
                        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(mx,my);ctx.stroke();
                    }
                }
            }
            raf=requestAnimationFrame(step);
        }
        function drawStatic(){
            ctx.clearRect(0,0,w,h);
            particles.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,.4)";ctx.fill();});
        }
        function start(){ cancelAnimationFrame(raf); if(!reduce) raf=requestAnimationFrame(step); else drawStatic(); }
        let rzT;
        addEventListener("resize",()=>{
            readCss();                    // keep cursor mapping correct even when we don't reallocate
            clearTimeout(rzT);
            rzT = setTimeout(()=>{
                const aspect = (canvas.clientWidth||innerWidth)/(canvas.clientHeight||innerHeight);
                // Pure zoom, or a mobile address-bar toggle while scrolling, keeps the aspect ratio
                // ~constant. In that case the browser already scaled the buffer smoothly for us, so we
                // do NOTHING — no reallocation, no repositioning, nothing to jerk.
                if(lastAspect!==null && Math.abs(aspect-lastAspect) < lastAspect*0.06) return;
                allocate(false);            // genuine shape change -> stretch particles to the new shape
                start();
            }, 200);
        });
        addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;},{passive:true});
        addEventListener("pointerleave",()=>{mouse.active=false;mouse.x=-9999;mouse.y=-9999;});
        document.addEventListener("visibilitychange",()=>{ if(document.hidden) cancelAnimationFrame(raf); else start(); });
        allocate(true); start();
    })();

    /* ---------- init ---------- */
    render("en");
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add("ready")));
</script>
</body>
</html>
