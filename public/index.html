<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artem Bilyi</title>
<meta name="description" content="Artem Bilyi, a cybersecurity graduate looking to start as a SOC analyst and work toward becoming a security architect." />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fff'/%3E%3C/svg%3E" />
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
  :root{
    --bg:#000;
    --fg:#f5f5f5;
    --muted:#8a8a8a;
    --line:rgba(255,255,255,.14);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{scrollbar-gutter:stable both-edges}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
    font-weight:300;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- particle canvas ---- */
  #field{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100lvh;z-index:0;display:block}

  /* ---- stage: split layout ---- */
  .stage{
    position:relative;z-index:1;
    min-height:100svh;
    overflow-x:clip;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    align-content:center;align-items:center;
    gap:clamp(28px,5vw,80px);
    padding:72px clamp(22px,4vw,48px);
    max-width:70rem;margin:0 auto;text-align:center;
  }

  /* ---- left / hero ---- */
  .left{
    width:min(100%,30rem);justify-self:center;
    opacity:0;transform:translateX(7vw);
    transition:opacity 1.1s var(--ease),transform 1.1s var(--ease);
  }
  body.ready .left{opacity:1;transform:none}
  .left h1{
    font-size:clamp(2.5rem,6.4vw,5rem);
    font-weight:200;letter-spacing:-.02em;line-height:1.02;
  }
  .left .lede{
    margin-top:16px;
    font-size:clamp(.95rem,1.3vw,1.0625rem);color:#cfcfcf;
  }
  .left .loc{margin-top:12px;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

  .featured{
    max-width:30rem;margin:28px auto 0;padding-top:16px;
    border-top:2px solid var(--line);
  }
  .featured-heading{
    display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:2px 9px;
  }
  .featured-label{font-size:.8125rem;color:var(--muted)}
  .featured-label span{margin-left:.3em}
  .featured h2{font-size:1.1875rem;line-height:1.25;font-weight:400}
  .featured-desc{margin-top:8px;font-size:.875rem;line-height:1.55;color:#bcbcbc;text-wrap:balance}
  .featured-link{
    display:flex;align-items:center;justify-content:center;text-align:center;
    min-height:44px;margin-top:14px;padding:8px 18px;border-radius:6px;
    background:var(--fg);color:var(--bg);text-decoration:none;font-size:.875rem;font-weight:500;
    transition:background .35s var(--ease),scale .22s var(--ease),translate .22s var(--ease);
  }
  .featured-link:not(.featured-link-intro):hover{background:#d6d6d6}
  .featured-link:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
  .featured-link-intro{
    animation:featured-link-settle .8s;
  }
  @keyframes featured-link-settle{
    0%,100%{transform-origin:top left}
    0%{transform:rotate(0);animation-timing-function:cubic-bezier(.5,0,.85,.55)}
    30%{transform:rotate(2.2deg);animation-timing-function:var(--ease)}
    66%{transform:rotate(-.5deg);animation-timing-function:ease-in-out}
    100%{transform:rotate(0)}
  }

  /* ---- right / panels ---- */
  .panel{
    opacity:0;transform:translateX(-34px);
    transition:opacity .9s var(--ease),transform .9s var(--ease);
  }
  body.ready .panel{opacity:1;transform:none}

  .panel-head{
    width:100%;background:none;border:none;color:#fff;font:inherit;
    text-align:center;cursor:pointer;
    display:flex;justify-content:center;align-items:baseline;gap:1rem;
    padding:22px 0;
  }
  .panel-head:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
  .p-idx{
    font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    font-size:.72rem;letter-spacing:.1em;color:var(--muted);
  }
  .p-label{font-size:clamp(1.05rem,1.7vw,1.35rem);font-weight:300;letter-spacing:-.01em}
  .panel-head:is(:hover,[aria-expanded="true"]) .p-label{
    text-decoration:underline;text-decoration-color:var(--muted);
    text-decoration-thickness:1px;text-underline-offset:.3em;
  }

  .panel-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
  .panel.open .panel-body{grid-template-rows:1fr}
  .panel-inner{overflow:hidden}
  .panel-content{padding:2px 0 28px;max-width:40em;margin-inline:auto}
  .panel-copy{color:#d0d0d0}

  /* projects inside panel */
  .proj{display:block;text-decoration:none;color:inherit;padding:16px 0;border-bottom:1px solid var(--line)}
  .proj:first-child{padding-top:0}
  .proj:last-child{border-bottom:none;padding-bottom:0}
  .proj-top{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:2px 12px}
  .proj-name{font-size:1.05rem;color:#fff;font-weight:400;overflow-wrap:anywhere}
  .proj-meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .proj-desc{display:block;color:var(--muted);margin-top:6px;font-size:.94rem;text-wrap:pretty}
  .proj-status{display:block;margin-top:8px;font-size:.84rem;color:var(--muted);text-wrap:pretty}
  .proj-status strong{color:var(--fg);font-weight:500}
  .arrow{display:inline-block;transition:transform .45s var(--ease)}
  .proj:hover .arrow{transform:translateX(8px)}

  /* contact inside panel */
  .links{display:flex;flex-direction:column;gap:16px}
  .links a{color:var(--fg);text-decoration:none;font-size:1.02rem;position:relative;width:fit-content;margin-inline:auto;max-width:100%;overflow-wrap:anywhere;padding-bottom:3px}
  .links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:#fff;transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
  .links a:hover::after{transform:scaleX(1);transform-origin:left}
  .links .k{color:var(--muted);font-size:11px;letter-spacing:.2em;text-transform:uppercase;display:block;margin-bottom:5px}

  /* ---- email reveal (Turnstile-gated) ---- */
  .email-slot{display:flex;flex-direction:column}
  .reveal-btn{
    display:inline-flex;align-items:center;gap:9px;width:max-content;margin-inline:auto;
    background:none;border:1px solid var(--line);color:#cfcfcf;
    font:inherit;font-size:.9rem;font-weight:300;letter-spacing:.02em;
    padding:8px 16px;border-radius:999px;cursor:pointer;
    transition:border-color .4s var(--ease),color .4s var(--ease),transform .4s var(--ease),opacity .4s var(--ease);
  }
  .reveal-btn:hover:not(:disabled){border-color:#fff;color:#fff}
  .reveal-btn:disabled{opacity:.45;cursor:default}
  .reveal-btn .lock{width:12px;height:12px;flex:none;opacity:.7}
  .reveal-btn .arrow{display:inline-block;transition:transform .45s var(--ease)}
  @media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){
    .featured-link:not(.featured-link-intro):hover{translate:0 -2px;scale:1.015}
    .p-label,.proj-name{transition:scale .22s var(--ease)}
    .panel-head:hover .p-label,.proj:hover .proj-name{scale:1.025}
    .reveal-btn:hover:not(:disabled){transform:translateY(-1px) scale(1.015)}
    .reveal-btn:hover:not(:disabled) .arrow{transform:translateX(4px)}
  }
  @media (prefers-reduced-motion:no-preference){
    .featured-link:not(.featured-link-intro):active{translate:0 0;scale:.99;transition-duration:.09s}
  }
  .ts-box{margin-top:14px;min-height:0}
  .ts-box:empty{margin-top:0}
  .reveal-msg{margin-top:10px;font-size:.84rem;letter-spacing:.02em;color:var(--muted)}
  .reveal-msg.err{color:#e0a3a3}

  /* ---- responsive: stack the profile and details on narrow screens ---- */
  @media (max-width:860px){
    .stage{grid-template-columns:minmax(0,1fr);align-content:center;gap:32px;padding:48px 22px;max-width:40rem}
    .left{width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .left,.panel{opacity:1;transform:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<main class="stage">
  <section class="left">
    <h1>Artem Bilyi</h1>
    <p class="lede">Aspiring security architect. Looking for a SOC analyst role.</p>
    <div class="loc">Saarland, Germany</div>
    <section class="featured" id="featured-project" aria-labelledby="featured-title"></section>
  </section>

  <aside class="right" id="panels"></aside>
</main>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const TURNSTILE_SITEKEY = "0x4AAAAAADz3Z9VFF9DldOId"; // public site key — safe in client
const EMAIL_ENDPOINT = "/api/email";                 // Pages Function; email lives server-side
const LEARN_START = location.protocol === "file:"
  ? "./recognize/index.html#/start"
  : "./recognize/#/start";
const LEARN_TITLE = "etrnl.recognize";
const CCTV_PROJECT = {
  n:"federated ai cctv search oversight",
  m:"Concept · Public",
  u:"https://github.com/eternalyouthy/Federated-AI-CCTV-Search-Oversight"
};
const ENTRA_PROJECT = {
  n:"entra-id-lifecycle-cli",
  m:"Python · Public",
  u:"https://github.com/eternalyouthy/entra-id-lifecycle-cli"
};

/* ============================================================
   CONTENT
   ============================================================ */
const DATA = {
  featured:{
    label:"Latest project",
    description:"Learn languages by finding familiar patterns in words, roots and expressions.",
    action:"Try it online"
  },
  now:{
    title:"What I’m doing now",
    text:"I’m learning languages, brushing up on cybersecurity fundamentals, and building new skills for my first role in the field. In my spare time, I sometimes use AI to build projects that interest me."
  },
  bg:{
    title:"Education",
    text:"Bachelor’s degree in cybersecurity."
  },
  proj:{
    title:"Projects",
    list:[
      {...CCTV_PROJECT, d:"A governance architecture for privacy-preserving, federated AI-assisted CCTV searches across independent security zones."},
      {...ENTRA_PROJECT,
       d:"Automates the Joiner–Mover–Leaver identity lifecycle in Entra ID through direct Microsoft Graph API calls.",
       status:{label:"On hold", reason:"Other commitments take priority right now."}}
    ]
  },
  contact:{title:"Contact", email_label:"Email", reveal:"Reveal email", verifying:"Verifying…", error:"Verification failed — try again"}
};


/* ---------- contact panel (email is NOT in this markup — it comes from the server) ---------- */
function contactsHTML(d){
  const c = d.contact;
  const emailBlock = `<button type="button" class="reveal-btn" id="reveal-btn">
         <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
           <rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
         </svg>
         <span class="reveal-txt">${c.reveal}</span>
         <span class="arrow">→</span>
       </button>
       <div class="ts-box" id="ts-box"></div>
       <div class="reveal-msg" id="reveal-msg" hidden></div>`;
  return `
  <div class="links">
    <div class="email-slot" id="email-slot">
      <span class="k">${c.email_label}</span>
      ${emailBlock}
    </div>
    <a href="https://github.com/eternalyouthy" target="_blank" rel="noopener"><span class="k">GitHub</span>eternalyouthy</a>
  </div>`;
}


/* ---------- build one panel ---------- */
function panelHTML(idx, label, bodyHTML){
  return `
  <div class="panel">
    <button class="panel-head" type="button" aria-expanded="false">
      <span class="p-idx" aria-hidden="true">${String(idx).padStart(2,"0")}</span>
      <span class="p-label">${label}</span>
    </button>
    <div class="panel-body" inert><div class="panel-inner"><div class="panel-content">${bodyHTML}</div></div></div>
  </div>`;
}
function projHTML(list){
  return list.map(p=>`
    <a class="proj" href="${p.u}" target="_blank" rel="noopener">
      <span class="proj-top"><span class="proj-name">${p.n} <span class="arrow" aria-hidden="true">→</span></span><span class="proj-meta">${p.m}</span></span>
      <span class="proj-desc">${p.d}</span>
      ${p.status ? `<span class="proj-status"><strong>${p.status.label}</strong> · ${p.status.reason}</span>` : ""}
    </a>`).join("");
}

/* ---------- render ---------- */
function render(d){
  const featured = d.featured;
  document.getElementById("featured-project").innerHTML = `
    <div class="featured-heading">
      <p class="featured-label">${featured.label} <span aria-hidden="true">→</span></p>
      <h2 id="featured-title">${LEARN_TITLE}</h2>
    </div>
    <p class="featured-desc">${featured.description}</p>
    <a class="featured-link" href="${LEARN_START}">${featured.action}</a>`;
  const projects = [
    {n:"recognize", m:"GitHub · Public", d:featured.description, u:"https://github.com/eternalyouthy/recognize"},
    ...d.proj.list
  ];

  const panels =
    panelHTML(1, d.now.title, `<p class="panel-copy">${d.now.text}</p>`) +
    panelHTML(2, d.bg.title, `<p class="panel-copy">${d.bg.text}</p>`) +
    panelHTML(3, d.proj.title, projHTML(projects)) +
    panelHTML(4, d.contact.title, contactsHTML(d));
  document.getElementById("panels").innerHTML = panels;
  wirePanels();
  wireEmail(d);
}

/* ---------- single-open accordion ---------- */
function wirePanels(){
  const panels = [...document.querySelectorAll(".panel")];
  panels.forEach(panel=>{
    const btn = panel.querySelector(".panel-head");
    btn.addEventListener("click",()=>{
      const isOpen = panel.classList.contains("open");
      panels.forEach(p=>{
        const open = p === panel && !isOpen;
        p.classList.toggle("open", open);
        p.querySelector(".panel-head").setAttribute("aria-expanded", String(open));
        p.querySelector(".panel-body").inert = !open;
      });
    });
  });
}

/* ---------- email reveal (Turnstile-gated) ---------- */
function wireEmail(d){
  let tsWidgetId = null;
  const btn = document.getElementById("reveal-btn");
  if(!btn) return;
  const tsBox = document.getElementById("ts-box");
  const msg   = document.getElementById("reveal-msg");
  const slot  = document.getElementById("email-slot");
  const c = d.contact;

  function showMsg(text, isErr){
    msg.hidden = false;
    msg.textContent = text;
    msg.classList.toggle("err", !!isErr);
  }

  async function verify(token){
    showMsg(c.verifying, false);
    try{
      const res = await fetch(EMAIL_ENDPOINT, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ token })
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && data.email){
        slot.innerHTML =
          `<span class="k">${c.email_label}</span>` +
          `<a href="mailto:${data.email}">${data.email}</a>`;
        return;
      }
      throw new Error("verify_failed");
    }catch(e){
      showMsg(c.error, true);
      btn.disabled = false;
      if(window.turnstile && tsWidgetId!==null){ try{ turnstile.reset(tsWidgetId); }catch(_){} }
    }
  }

  btn.addEventListener("click", ()=>{
    if(!window.turnstile){ showMsg(c.error, true); return; }
    btn.disabled = true;
    msg.hidden = true;
    tsBox.innerHTML = "";
    tsWidgetId = turnstile.render(tsBox, {
      sitekey: TURNSTILE_SITEKEY,
      theme: "dark",
      size: tsBox.clientWidth < 300 ? "compact" : "normal",
      callback: verify,
      "error-callback": ()=>{ showMsg(c.error, true); btn.disabled = false; },
      "expired-callback": ()=>{ if(window.turnstile && tsWidgetId!==null) turnstile.reset(tsWidgetId); }
    });
  });
}


/* ---------- particle field ---------- */
(function(){
  const canvas = document.getElementById("field");
  const ctx = canvas.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  let w,h,dpr,cssW=0,cssH=0,particles=[],mouse={x:-9999,y:-9999,active:false},raf,lastAspect=null;

  // Current on-screen (CSS px) size of the canvas element.
  function readCss(){
    cssW = canvas.clientWidth  || window.innerWidth;
    cssH = canvas.clientHeight || window.innerHeight;
  }

  function makeParticle(){
    return {
      x:Math.random()*w, y:Math.random()*h,
      vx:(Math.random()-.5)*.12*dpr, vy:(Math.random()-.5)*.12*dpr,
      r:(Math.random()*1.4+.6)*dpr
    };
  }
  function targetCount(){
    let c = Math.round(((w/dpr)*(h/dpr))/13000);
    return Math.max(40, Math.min(c, 150));
  }
  function reconcile(){
    const t = targetCount();
    while(particles.length < t) particles.push(makeParticle());
    if(particles.length > t) particles.length = t;
  }
  function build(){
    particles = [];
    const t = targetCount();
    for(let i=0;i<t;i++) particles.push(makeParticle());
  }

  // Allocate the pixel buffer. The canvas ELEMENT is sized by CSS (100vw x 100lvh) and the
  // browser scales this fixed buffer to fit — so scrolling and zooming never touch it at all
  // (zero JS work in those moments => nothing can jerk). We only reallocate when the window's
  // ASPECT RATIO really changes, and then we stretch existing particles proportionally so the
  // pattern stays continuous instead of regenerating.
  function allocate(initial){
    const prevW = w, prevH = h;
    dpr = Math.min(window.devicePixelRatio||1, 2);
    readCss();
    const nw = Math.max(1, Math.floor(cssW*dpr));
    const nh = Math.max(1, Math.floor(cssH*dpr));
    if(!initial && prevW && prevH && particles.length){
      const sx = nw/prevW, sy = nh/prevH;
      for(const p of particles){ p.x*=sx; p.y*=sy; }
    }
    w = canvas.width  = nw;
    h = canvas.height = nh;
    lastAspect = cssW/cssH;
    if(initial) build(); else reconcile();
  }
  const LINK = 120;
  function step(){
    ctx.clearRect(0,0,w,h);
    const sX = w/(cssW||1), sY = h/(cssH||1);   // cursor is in CSS px -> scale into buffer px
    const link = LINK*dpr, mx = mouse.x*sX, my = mouse.y*sY;
    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>w) p.vx*=-1;
      if(p.y<0||p.y>h) p.vy*=-1;
      if(mouse.active){
        const dx=mx-p.x, dy=my-p.y, dist=Math.hypot(dx,dy);
        if(dist<link*1.6 && dist>0.01){
          const f=(1-dist/(link*1.6))*0.35;
          p.x+=dx/dist*f; p.y+=dy/dist*f;
        }
      }
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle="rgba(255,255,255,.55)";ctx.fill();
      for(let j=i+1;j<particles.length;j++){
        const q=particles[j];
        const dx=p.x-q.x, dy=p.y-q.y, dd=Math.hypot(dx,dy);
        if(dd<link){
          ctx.strokeStyle="rgba(255,255,255,"+(0.16*(1-dd/link))+")";
          ctx.lineWidth=dpr*.6;
          ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
        }
      }
      if(mouse.active){
        const dx=p.x-mx, dy=p.y-my, dd=Math.hypot(dx,dy);
        if(dd<link*1.4){
          ctx.strokeStyle="rgba(255,255,255,"+(0.28*(1-dd/(link*1.4)))+")";
          ctx.lineWidth=dpr*.7;
          ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(mx,my);ctx.stroke();
        }
      }
    }
    raf=requestAnimationFrame(step);
  }
  function drawStatic(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,.4)";ctx.fill();});
  }
  function start(){ cancelAnimationFrame(raf); if(!reduce) raf=requestAnimationFrame(step); else drawStatic(); }
  let rzT;
  addEventListener("resize",()=>{
    readCss();                    // keep cursor mapping correct even when we don't reallocate
    clearTimeout(rzT);
    rzT = setTimeout(()=>{
      const aspect = (canvas.clientWidth||innerWidth)/(canvas.clientHeight||innerHeight);
      // Pure zoom, or a mobile address-bar toggle while scrolling, keeps the aspect ratio
      // ~constant. In that case the browser already scaled the buffer smoothly for us, so we
      // do NOTHING — no reallocation, no repositioning, nothing to jerk.
      if(lastAspect!==null && Math.abs(aspect-lastAspect) < lastAspect*0.06) return;
      allocate(false);            // genuine shape change -> stretch particles to the new shape
      start();
    }, 200);
  });
  addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;},{passive:true});
  addEventListener("pointerleave",()=>{mouse.active=false;mouse.x=-9999;mouse.y=-9999;});
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) cancelAnimationFrame(raf); else start(); });
  allocate(true); start();
})();

/* ---------- init ---------- */
render(DATA);
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add("ready")));
setTimeout(()=>{
  const link = document.querySelector(".featured-link");
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches ||
     link.matches(":hover, :active, :focus-visible") || link.getAnimations().length) return;

  link.classList.add("featured-link-intro");
  const animations = link.getAnimations();
  Promise.allSettled(animations.map(animation=>animation.finished))
    .then(()=>link.classList.remove("featured-link-intro"));
}, 3100);
</script>
</body>
</html>
